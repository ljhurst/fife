---
name: Deploy Application

# yamllint disable rule:truthy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync ./dist/ s3://lj-fife/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2GDH4UB0IP938 \
            --paths "/*"

  deploy-backend:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: make lambda-packages

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        run: |
          for zip_file in $(find bin/lambda/arm64 -name "function.zip"); do
            function_dir=$(dirname "$zip_file")

            parent_dir=$(basename "$(dirname "$function_dir")" | tr '_' '-')
            function_dir_name=$(basename "$function_dir" | tr '_' '-')

            function_name="fife-${parent_dir}-${function_dir_name}"

            aws lambda update-function-code \
              --function-name "$function_name" \
              --zip-file "fileb://$zip_file" \
              --publish
          done
