---
name: Deploy

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ljhurst/stych/.github/workflows/terraform.yml@v1
    with:
      plan-role-arn: arn:aws:iam::755958650241:role/stych/fife-ci-plan
      apply-role-arn: arn:aws:iam::755958650241:role/stych/fife-ci-apply
      build-command: backend/scripts/build_lambda.sh
      go-version-file: backend/go.mod

  site:
    needs: terraform
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ljhurst/stych/.github/workflows/static-site.yml@v1
    with:
      plan-role-arn: arn:aws:iam::755958650241:role/stych/fife-ci-plan
      apply-role-arn: arn:aws:iam::755958650241:role/stych/fife-ci-apply
      bucket: lj-fife
      distribution-id: E2GDH4UB0IP938
      node-version-file: frontend/.nvmrc
      build-command: >-
        cd frontend && npm ci && npm run build
        && mkdir -p ../site && cp -r dist/. ../site/
